<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Customer Messages - CopierStore Admin</title><link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden}body{font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}.nav{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 5%;display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-size:21px;font-weight:900}.logo span{color:#2563eb}.nav a{color:#475569;text-decoration:none;font-size:12px;font-weight:850}.layout{width:min(1180px,calc(100% - 24px));margin:auto;padding:20px 0;display:grid;grid-template-columns:330px 1fr;gap:14px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden}.panel-head{padding:14px;border-bottom:1px solid #e2e8f0;font-weight:900;display:flex;justify-content:space-between}.badge{background:#ef4444;color:#fff;border-radius:999px;padding:2px 7px;font-size:10px}.conversation-list{max-height:650px;overflow:auto}.conversation{display:block;width:100%;text-align:left;padding:13px 14px;border:0;border-bottom:1px solid #f1f5f9;background:#fff;color:#172033;cursor:pointer}.conversation.active{background:#eff6ff}.conversation strong{display:block;font-size:12px}.conversation small{display:block;color:#64748b;font-size:10px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conversation .new{float:right;color:#dc2626;font-weight:900}.chat-head{padding:14px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;gap:10px}.chat-head strong{font-size:14px}.context{font-size:10px;color:#64748b;margin-top:3px}.order-select{padding:12px;border-bottom:1px solid #e2e8f0;display:flex;gap:8px}.order-select select,.order-select button{flex:1;border:1px solid #dbe3ef;border-radius:9px;padding:9px;background:#fff}.order-select button{background:#2563eb;color:#fff;border:0;font-weight:900}.messages{height:510px;overflow:auto;padding:18px;background:#f8fafc}.row{display:flex;margin:9px 0}.row.admin{justify-content:flex-end}.bubble{max-width:min(72%,520px);background:#e2e8f0;padding:10px 13px;border-radius:14px;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.admin .bubble{background:#2563eb;color:#fff}.time{font-size:8px;opacity:.65;margin-top:4px}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #e2e8f0}.composer input{flex:1;min-width:0;border:1px solid #dbe3ef;border-radius:10px;padding:10px}.composer button{border:0;background:#2563eb;color:#fff;border-radius:10px;padding:0 15px;font-weight:900}.new-conversation{padding:12px;border-top:1px solid #e2e8f0}.new-conversation select,.new-conversation button{width:100%;padding:10px;border:1px solid #dbe3ef;border-radius:9px;margin-top:7px;background:#fff}.new-conversation button{background:#111827;color:#fff;font-weight:900}.empty{padding:40px;text-align:center;color:#64748b;font-size:12px}@media(max-width:800px){.nav{padding:11px 14px}.layout{display:block;width:100%;padding:0}.panel{border-radius:0;border-left:0;border-right:0}.conversation-list{display:flex;overflow-x:auto;max-height:none}.conversation{min-width:190px;border-right:1px solid #f1f5f9}.chat-panel{margin-top:10px}.messages{height:calc(100dvh - 285px);min-height:340px;padding:12px}.bubble{max-width:84%;font-size:13px}.composer{position:sticky;bottom:0;background:#fff}.composer input{font-size:16px}.order-select{display:grid;grid-template-columns:1fr}.order-select select,.order-select button{width:100%;margin:0}}
</style></head><body>
<nav class="nav"><div class="logo">Copier<span>Store</span> Admin</div><div><a href="/admin">Dashboard</a> &nbsp;·&nbsp; <a href="/orders">Orders</a> &nbsp;·&nbsp; <a href="/logout">Logout</a></div></nav>
<main class="layout"><section class="panel"><div class="panel-head">💬 Customer conversations <span class="badge" id="adminBadge" {% if not admin_unread %}style="display:none"{% endif %}>{{ admin_unread }}</span></div><div id="conversationList" class="conversation-list"></div><div class="new-conversation"><strong style="font-size:11px">Start a new conversation</strong><select id="customerSelect"><option value="">Choose customer…</option></select><select id="newOrderSelect"><option value="">General support</option></select><button id="startBtn">💬 Message Customer</button></div></section>
<section class="panel chat-panel"><div class="chat-head"><div><strong id="chatTitle">Select a conversation</strong><div id="context" class="context">Admin can start the conversation or reply to the customer.</div></div></div><div class="order-select"><select id="linkOrder"><option value="">No order link</option></select><button id="linkBtn">Link Order</button></div><div id="messages" class="messages"><div class="empty">Select a conversation.</div></div><form id="composer" class="composer"><input id="message" maxlength="1000" placeholder="Message customer…" disabled><button id="send" disabled>Send</button></form></section></main>
<script>
let conversationId=null,lastId=0,loading=false;const list=document.getElementById('conversationList'),box=document.getElementById('messages'),input=document.getElementById('message'),send=document.getElementById('send');
function render(rows){list.innerHTML='';if(!rows.length){list.innerHTML='<div class="empty">No conversations yet.</div>';return}rows.forEach(c=>{const b=document.createElement('button');b.className='conversation '+(Number(c.id)===Number(conversationId)?'active':'');b.type='button';b.dataset.id=c.id;b.innerHTML='<strong></strong><small></small>';b.querySelector('strong').textContent=(c.customer_name||'Customer')+(c.order_id?' · #'+c.order_id:'')+(c.unread?'  • '+c.unread+' new':'');b.querySelector('small').textContent=c.last_message||'No messages yet';b.onclick=()=>open(c.id);list.appendChild(b)})}
async function conversations(){const r=await fetch('/api/chat/conversations',{credentials:'same-origin'});const d=await r.json();if(!d.success)return;render(d.conversations);const b=document.getElementById('adminBadge');b.textContent=d.unread_total||0;b.style.display=d.unread_total?'inline-block':'none';populateCustomers(d.conversations)}
async function populateCustomers(){const sel=document.getElementById('customerSelect');const old=sel.value;try{const r=await fetch('/api/chat/admin/customers',{credentials:'same-origin'});const d=await r.json();if(!r.ok||!d.success)return;sel.innerHTML='<option value="">Choose customer…</option>';(d.customers||[]).forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=(c.name||'Customer')+(c.email?' · '+c.email:'');sel.appendChild(o)});if(old)sel.value=old}catch(e){console.error(e)}}
async function open(id){conversationId=id;lastId=0;box.innerHTML='';input.disabled=false;send.disabled=false;await load(true);renderActive()}
function renderActive(){document.querySelectorAll('.conversation').forEach(x=>x.classList.toggle('active',Number(x.dataset.id)===Number(conversationId)))}
async function load(reset=false){if(!conversationId||loading)return;loading=true;try{const r=await fetch('/api/chat/messages?conversation_id='+conversationId+'&after_id='+lastId,{credentials:'same-origin'});const d=await r.json();if(!d.success)return;const c=d.conversation;document.getElementById('chatTitle').textContent=(c.customer_name||'Customer')+(c.order_id?' · Order #'+c.order_id:'');document.getElementById('context').textContent=(c.customer_email||'')+' · Conversation #'+c.id;const sel=document.getElementById('linkOrder');if(reset){sel.innerHTML='<option value="">No order link</option>';if(c.order_id)sel.value=c.order_id}d.messages.forEach(m=>{lastId=Math.max(lastId,m.id);const row=document.createElement('div');row.className='row '+m.sender_type;const bub=document.createElement('div');bub.className='bubble';bub.textContent=m.message;const t=document.createElement('div');t.className='time';t.textContent=m.created_at;bub.appendChild(t);row.appendChild(bub);box.appendChild(row)});if(reset||d.messages.length)box.scrollTop=box.scrollHeight;await conversations();renderActive()}finally{loading=false}}
document.getElementById('composer').addEventListener('submit',async(e)=>{
 e.preventDefault();
 if(!conversationId)return;
 const text=input.value.trim();
 if(!text)return;
 send.disabled=true; input.disabled=true;
 try{
   const fd=new FormData();
   fd.append('conversation_id',String(conversationId));
   fd.append('message',text);
   const r=await fetch('/api/chat/send',{method:'POST',body:fd,credentials:'same-origin'});
   const d=await r.json().catch(()=>({success:false,error:'Invalid server response'}));
   if(!r.ok||!d.success){alert(d.error||'Message could not be sent.');return;}
   input.value='';
   await load();
   await conversations();
   renderActive();
 }catch(err){console.error(err);alert('Could not send message. Check the server terminal for details.');}
 finally{input.disabled=false;send.disabled=false;input.focus();}
});
document.getElementById('startBtn').onclick=async()=>{const customer=document.getElementById('customerSelect').value;if(!customer){alert('Choose a customer first.');return}const order=document.getElementById('newOrderSelect').value||null;const r=await fetch('/api/chat/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:Number(customer),order_id:order?Number(order):null}),credentials:'same-origin'});const d=await r.json();if(!d.success){alert(d.error||'Could not start conversation');return}conversationId=d.conversation_id;lastId=0;await conversations();await open(conversationId)};
document.getElementById('customerSelect').onchange=async()=>{const cid=document.getElementById('customerSelect').value;const sel=document.getElementById('newOrderSelect');sel.innerHTML='<option value="">General support</option>';if(!cid)return;try{const r=await fetch('/api/chat/admin/orders?customer_id='+encodeURIComponent(cid),{credentials:'same-origin'});const d=await r.json();if(!r.ok||!d.success)return;(d.orders||[]).forEach(o=>{const opt=document.createElement('option');opt.value=o.id;opt.textContent='Order #'+o.id+' · '+(o.status||'');sel.appendChild(opt)})}catch(e){console.error(e)}};
conversations();populateCustomers();setInterval(conversations,2500);setInterval(populateCustomers,10000);setInterval(()=>load(),2000);
</script></body></html>
