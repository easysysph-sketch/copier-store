<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supplier Login | CopierStore</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(420px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:28px;box-shadow:0 15px 40px rgba(15,23,42,.06)}h1{margin-bottom:6px}.muted{color:#64748b;font-size:13px;margin-bottom:22px}label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer}.error{margin-top:14px;padding:10px;border-radius:9px;background:#fee2e2;color:#991b1b;font-size:13px}</style></head><body><main class="card"><h1>👨‍💼 Supplier Portal</h1><p class="muted">Read-only sales and commission overview for your supplier account.</p><form method="POST"><label>Email</label><input type="email" name="email" required><label>Password</label><input type="password" name="password" required><button>Sign in</button></form>{% if error %}<div class="error">{{ error }}</div>{% endif %}<p style="margin-top:18px;font-size:12px;color:#94a3b8">Supplier credentials are configured privately by the store owner.</p><a href="/" style="display:block;margin-top:12px;color:#2563eb;font-weight:800;text-decoration:none">← Back to Store</a></main></body></html>
