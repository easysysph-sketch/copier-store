<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Admin Password - CopierStore</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
    <style>
        .recovery-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .recovery-card {
            width: 100%;
            max-width: 480px;
            padding: 32px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(15, 23, 42, .08);
        }
        .recovery-card h1 { margin: 0 0 8px; }
        .recovery-card .muted { color: #64748b; margin-bottom: 24px; }
        .recovery-card label {
            display: block;
            margin: 14px 0 7px;
            font-weight: 600;
        }
        .recovery-card input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font: inherit;
        }
        .recovery-card button {
            width: 100%;
            margin-top: 20px;
            padding: 12px 16px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
        .notice {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 16px;
        }
        .error { background: #fee2e2; color: #991b1b; }
        .success { background: #dcfce7; color: #166534; }
        .back-link { display: inline-block; margin-top: 18px; }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
</head>
<body>
    <main class="recovery-page">
        <section class="recovery-card">
            <h1>🔐 Reset Admin Password</h1>
            <p class="muted">Use your recovery key to create a new admin password.</p>

            {% if error %}
                <div class="notice error">{{ error }}</div>
            {% endif %}

            {% if success %}
                <div class="notice success">{{ success }}</div>
            {% endif %}

            <form method="POST">
                <label for="username">Admin username</label>
                <input id="username" name="username" type="text" autocomplete="username" required>

                <label for="recovery_key">Recovery key</label>
                <input id="recovery_key" name="recovery_key" type="password" autocomplete="off" required>

                <label for="new_password">New password</label>
                <input id="new_password" name="new_password" type="password" minlength="8" autocomplete="new-password" required>

                <label for="confirm_password">Confirm new password</label>
                <input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required>

                <button type="submit">Reset Password</button>
            </form>

            <a class="back-link" href="/login">← Back to Admin Login</a>
        </section>
    </main>
</body>
</html>
