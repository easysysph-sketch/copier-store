<!DOCTYPE html>
<html>

<head>

    <title>Forgot Password - CopierStore</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 500px;
            margin: 70px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
        }

        .logo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .logo span {
            color: #2563eb;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .info {
            background: #eff6ff;
            color: #1e40af;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

    </style>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="logo">
                Copier<span>Store</span>
            </div>


            <h1>
                🔑 Forgot Password?
            </h1>

            <p class="subtitle">
                Enter your email and phone number to verify
                your account and reset your password.
            </p>


            {% if error %}

                <div class="error">
                    ❌ {{ error }}
                </div>

            {% endif %}


            {% if step == "reset" %}

                <div class="info">
                    ✅ Account verified! You can now create
                    a new password.
                </div>


                <form
                    action="/forgot-password"
                    method="POST"
                >

                    <input
                        type="hidden"
                        name="step"
                        value="reset"
                    >

                    <input
                        type="hidden"
                        name="reset_token"
                        value="{{ reset_token }}"
                    >


                    <div class="field">

                        <label>
                            New Password
                        </label>

                        <input
                            type="password"
                            name="new_password"
                            placeholder="Enter new password"
                            minlength="6"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            Confirm New Password
                        </label>

                        <input
                            type="password"
                            name="confirm_password"
                            placeholder="Confirm new password"
                            minlength="6"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="button"
                    >
                        🔐 Reset Password
                    </button>

                </form>


            {% else %}


                <form
                    action="/forgot-password"
                    method="POST"
                >

                    <input
                        type="hidden"
                        name="step"
                        value="verify"
                    >


                    <div class="field">

                        <label>
                            Email Address
                        </label>

                        <input
                            type="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            Phone Number
                        </label>

                        <input
                            type="text"
                            name="phone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="button"
                    >
                        🔎 Verify Account
                    </button>

                </form>


            {% endif %}


            <div class="back">

                <a href="/customer-login">
                    ← Back to Login
                </a>

            </div>

        </div>

    </div>

</body>

</html>
