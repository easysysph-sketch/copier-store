<!DOCTYPE html>
<html>

<head>

    <title>AI Customer Support - CopierStore</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ session.get('csrf_token', '') }}">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        /* NAVBAR */

        .navbar {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 17px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
        }

        .logo span {
            color: #2563eb;
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-links a {
            text-decoration: none;
            color: #374151;
            background: #f3f4f6;
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .nav-links a:hover {
            background: #e5e7eb;
        }

        /* PAGE */

        .page {
            max-width: 900px;
            margin: auto;
            padding: 35px 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .robot {
            width: 62px;
            height: 62px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eff6ff;
            border-radius: 18px;
            font-size: 32px;
            margin-bottom: 12px;
        }

        .page-header h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .page-header p {
            color: #6b7280;
        }

        /* CHAT CARD */

        .chat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        /* CHAT HEADER */

        .chat-header {
            padding: 18px 22px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .chat-header h2 {
            font-size: 16px;
            margin-bottom: 3px;
        }

        .online {
            color: #16a34a;
            font-size: 12px;
            font-weight: bold;
        }

        /* CHAT BOX */

        #chatBox {
            height: 500px;
            overflow-y: auto;
            padding: 22px;
            background: #f8fafc;
        }

        .message-row {
            display: flex;
            margin-bottom: 15px;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message {
            max-width: 75%;
            padding: 13px 16px;
            border-radius: 15px;
            line-height: 1.55;
            font-size: 14px;
            word-wrap: break-word;
        }

        .message.ai {
            background: white;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 5px;
        }

        .message.user {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message-label {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 5px;
            opacity: 0.65;
        }

        .message.user .message-label {
            opacity: 0.85;
        }

        /* AI RESPONSE FORMATTING */

        .message.ai p {
            margin-bottom: 8px;
        }

        .message.ai p:last-child {
            margin-bottom: 0;
        }

        .message.ai ul {
            margin: 8px 0 8px 20px;
        }

        .message.ai li {
            margin-bottom: 5px;
        }

        .message.ai strong {
            font-weight: 700;
        }

        /* TYPING */

        .typing {
            display: flex;
            gap: 4px;
            padding: 5px 0;
        }

        .typing span {
            width: 7px;
            height: 7px;
            background: #9ca3af;
            border-radius: 50%;
            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }

        }

        /* INPUT */

        .input-area {
            padding: 16px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
        }

        #message {
            flex: 1;
            padding: 13px 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        #message:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        #sendButton {
            padding: 0 20px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #sendButton:hover {
            background: #1d4ed8;
        }

        #sendButton:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        /* QUICK QUESTIONS */

        .quick-questions {
            padding: 14px 18px;
            background: white;
            border-top: 1px solid #f0f0f0;
        }

        .quick-title {
            font-size: 11px;
            color: #6b7280;
            font-weight: bold;
            margin-bottom: 9px;
        }

        .quick-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .quick-button {
            border: 1px solid #dbe3ef;
            background: #f8fafc;
            color: #374151;
            padding: 8px 11px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }

        .quick-button:hover {
            border-color: #2563eb;
            color: #2563eb;
            background: #eff6ff;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .navbar {
                padding: 15px 20px;
            }

            .nav-links a {
                font-size: 12px;
                padding: 8px 10px;
            }

            .page {
                padding: 20px 12px;
            }

            .page-header h1 {
                font-size: 25px;
            }

            #chatBox {
                height: 450px;
                padding: 15px;
            }

            .message {
                max-width: 88%;
            }

            .input-area {
                padding: 12px;
            }

            #sendButton {
                padding: 0 15px;
            }

        }
    </style>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            Copier<span>Store</span>
        </div>

        <div class="nav-links">

            <a href="/">
                🏪 Store
            </a>

            <a href="/customer-dashboard">
                👤 Dashboard
            </a>

        </div>

    </nav>


    <!-- PAGE -->

    <div class="page">


        <div class="page-header">

            <div class="robot">
                🤖
            </div>

            <h1>
                AI Customer Support
            </h1>

            <p>
                Ask us about products, prices, delivery, and more.
            </p>

        </div>


        <div class="chat-card">


            <!-- CHAT HEADER -->

            <div class="chat-header">

                <div class="status-icon">
                    🤖
                </div>

                <div>

                    <h2>
                        CopierStore Assistant
                    </h2>

                    <div class="online">
                        ● Online
                    </div>

                </div>

            </div>


            <!-- CHAT -->

            <div id="chatBox">


                <div class="message-row">

                    <div class="message ai">

                        <div class="message-label">
                            🤖 AI ASSISTANT
                        </div>

                        Hi! 👋 How can I help you today?

                    </div>

                </div>


            </div>


            <!-- QUICK QUESTIONS -->

            <div class="quick-questions">

                <div class="quick-title">
                    QUICK QUESTIONS
                </div>

                <div class="quick-buttons">

                    <button class="quick-button" onclick="quickAsk('What products do you sell?')">
                        🛍️ Products
                    </button>

                    <button class="quick-button" onclick="quickAsk('What are your delivery fees?')">
                        🚚 Delivery
                    </button>

                    <button class="quick-button" onclick="quickAsk('What payment methods do you accept?')">
                        💳 Payment
                    </button>

                    <button class="quick-button" onclick="quickAsk('What is your cheapest product?')">
                        💰 Cheapest product
                    </button>

                </div>

            </div>


            <!-- INPUT -->

            <div class="input-area">

                <input type="text" id="message" placeholder="Ask something..." autocomplete="off">

                <button id="sendButton" onclick="sendMessage()">
                    Send
                </button>

            </div>


        </div>


    </div>


    <script>


        async function sendMessage() {

            const input =
                document.getElementById("message");

            const sendButton =
                document.getElementById("sendButton");

            const chatBox =
                document.getElementById("chatBox");

            const message =
                input.value.trim();


            if (message === "") {
                return;
            }


            /* USER MESSAGE */

            const userRow =
                document.createElement("div");

            userRow.className =
                "message-row user";


            const userMessage =
                document.createElement("div");

            userMessage.className =
                "message user";


            userMessage.innerHTML = `
        <div class="message-label">
            👤 YOU
        </div>
        ${escapeHtml(message)}
    `;


            userRow.appendChild(userMessage);

            chatBox.appendChild(userRow);


            input.value = "";

            sendButton.disabled = true;


            /* TYPING */

            const loadingRow =
                document.createElement("div");

            loadingRow.className =
                "message-row";


            const loading =
                document.createElement("div");

            loading.className =
                "message ai";


            loading.innerHTML = `
        <div class="message-label">
            🤖 AI ASSISTANT
        </div>

        <div class="typing">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;


            loadingRow.appendChild(loading);

            chatBox.appendChild(loadingRow);


            chatBox.scrollTop =
                chatBox.scrollHeight;


            /* SEND TO FLASK */

            const formData =
                new FormData();

            formData.append(
                "message",
                message
            );


            try {

                const csrfToken =
                    document.querySelector('meta[name="csrf-token"]')?.content || "";

                // /ask-ai is a normal POST endpoint, so the global CSRF
                // middleware expects the token in the submitted form.
                // Keep the same-origin credentials as an additional safeguard.
                formData.set("_csrf_token", csrfToken);

                const response =
                    await fetch(
                        "/ask-ai",
                        {
                            method: "POST",
                            body: formData,
                            credentials: "same-origin",
                            headers: {
                                "X-CSRF-Token": csrfToken
                            }
                        }
                    );

                // /ask-ai currently returns plain text for most responses,
                // while some future versions may return JSON. Accept both.
                const raw = await response.text();
                let answer = raw;
                try {
                    const data = JSON.parse(raw);
                    if (data && typeof data === "object") {
                        if (data.success === false) {
                            throw new Error(data.error || "AI request failed");
                        }
                        answer = data.answer || raw;
                    }
                } catch (parseError) {
                    if (!response.ok) {
                        throw new Error(raw || "AI request failed");
                    }
                }

                if (!response.ok) {
                    throw new Error(answer || "AI request failed");
                }
                if (!answer) {
                    answer = "🤖 I couldn't generate an answer right now.";
                }


                /*
                    Convert Gemini Markdown
                    into cleaner HTML.
                */

                loading.innerHTML = `
            <div class="message-label">
                🤖 AI ASSISTANT
            </div>

            ${formatAIResponse(answer)}
        `;


            } catch (error) {

                loading.innerHTML = `
            <div class="message-label">
                🤖 AI ASSISTANT
            </div>

            Sorry, something went wrong. 😭
            Please try again.
        `;

                console.error(error);

            }


            sendButton.disabled = false;

            input.focus();


            chatBox.scrollTop =
                chatBox.scrollHeight;

        }


        /* QUICK QUESTIONS */

        function quickAsk(question) {

            document.getElementById(
                "message"
            ).value = question;

            sendMessage();

        }


        /* FORMAT AI RESPONSE */

        function formatAIResponse(text) {

            let safe =
                escapeHtml(text);


            /*
                Bold:
                **text**
            */

            safe =
                safe.replace(
                    /\*\*(.*?)\*\*/g,
                    "<strong>$1</strong>"
                );


            /*
                Bullet points
            */

            safe =
                safe.replace(
                    /^\s*[-•]\s+(.*)$/gm,
                    "<li>$1</li>"
                );


            safe =
                safe.replace(
                    /(<li>.*<\/li>)/gs,
                    "<ul>$1</ul>"
                );


            /*
                Line breaks
            */

            safe =
                safe.replace(
                    /\n{2,}/g,
                    "</p><p>"
                );


            safe =
                safe.replace(
                    /\n/g,
                    "<br>"
                );


            return `<p>${safe}</p>`;

        }


        /* SECURITY */

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent =
                text;

            return div.innerHTML;

        }


        /* ENTER TO SEND */

        document
            .getElementById("message")
            .addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key === "Enter"
                        && !event.shiftKey
                    ) {

                        event.preventDefault();

                        sendMessage();

                    }

                }
            );


    </script>


</body>

</html>
