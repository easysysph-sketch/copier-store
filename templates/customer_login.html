<!DOCTYPE html>
<html>

<head>

    <title>Customer Login - CopierStore</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 450px;
            margin: 70px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
        }

        .logo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .logo span {
            color: #2563eb;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            font-size: 14px;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }
    </style>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="logo">
                Copier<span>Store</span>
            </div>

            <h1>Welcome back 👋</h1>

            <p class="subtitle">
                Log in to manage your orders and repair requests.
            </p>

            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}

            <form action="/customer-login" method="POST">

                <div class="form-group">

                    <label>Email</label>

                    <input type="email" name="email" placeholder="you@example.com" required>

                    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <input type="password" name="password" placeholder="Your password" required>

                </div>

                <button type="submit" class="button">
                    Log In
                </button>

                <div style="text-align:center; margin-top:15px;">
                    <a href="/forgot-password" style="
                            color:#2563eb;
                            text-decoration:none;
                            font-weight:bold;
                            font-size:14px;
                        ">
                        Forgot Password?
                    </a>
                </div>

            </form>

            <div class="register-link">

                Don't have an account?
                <a href="/register">
                    Create one
                </a>

            </div>

        </div>

    </div>

</body>

</html>
