<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Messages - CopierStore</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden}body{font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}.nav{min-height:64px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:12px 6%;gap:12px}.logo{font-size:21px;font-weight:900}.logo span{color:#2563eb}.nav a{color:#475569;text-decoration:none;font-size:12px;font-weight:800}.nav-right{display:flex;gap:12px;align-items:center}.badge{background:#ef4444;color:#fff;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:900}.wrap{width:min(1050px,calc(100% - 24px));margin:20px auto}.grid{display:grid;grid-template-columns:290px 1fr;gap:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,.05)}.side-head,.chat-head{padding:15px;border-bottom:1px solid #e2e8f0}.side-head{font-weight:900}.conversation{display:block;padding:13px 15px;border:0;border-bottom:1px solid #f1f5f9;background:#fff;width:100%;text-align:left;cursor:pointer}.conversation.active{background:#eff6ff}.conversation strong{display:block;font-size:12px}.conversation small{display:block;color:#64748b;font-size:10px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.new-chat{padding:12px;border-top:1px solid #e2e8f0}.new-chat select,.new-chat button{width:100%;border:1px solid #dbe3ef;border-radius:10px;padding:10px;margin-top:7px;background:#fff}.new-chat button,.composer button{background:#2563eb;color:#fff;border:0;font-weight:900;cursor:pointer}.chat-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.chat-title{font-weight:900}.order-chip{font-size:10px;background:#eff6ff;color:#1d4ed8;padding:5px 8px;border-radius:999px;font-weight:800}.messages{height:510px;overflow-y:auto;padding:18px;background:#f8fafc}.bubble-row{display:flex;margin:9px 0}.bubble-row.customer{justify-content:flex-end}.bubble{max-width:min(72%,520px);padding:10px 13px;border-radius:15px;background:#e2e8f0;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.customer .bubble{background:#2563eb;color:#fff;border-bottom-right-radius:5px}.admin .bubble{border-bottom-left-radius:5px}.time{font-size:8px;opacity:.65;margin-top:4px}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #e2e8f0}.composer input{flex:1;min-width:0;border:1px solid #dbe3ef;border-radius:11px;padding:11px 13px;outline:none}.composer button{border-radius:11px;padding:0 17px}.empty{padding:35px 15px;text-align:center;color:#64748b;font-size:12px}@media(max-width:720px){.nav{padding:11px 14px}.nav-right a:first-child{display:none}.wrap{width:100%;margin:0}.grid{display:block}.side{border-radius:0;border-left:0;border-right:0}.chat{margin-top:10px;border-radius:0;border-left:0;border-right:0}.conversation-list{display:flex;overflow-x:auto}.conversation{min-width:180px;border-right:1px solid #f1f5f9}.new-chat{display:grid;grid-template-columns:1fr 1fr;gap:7px}.new-chat select,.new-chat button{margin:0}.messages{height:calc(100dvh - 245px);min-height:340px;padding:12px}.bubble{max-width:84%;font-size:13px}.composer{position:sticky;bottom:0;background:#fff;padding:10px}.composer input{font-size:16px}.composer button{padding:0 14px}.chat-head{padding:12px}}
</style>
</head>
<body>
<nav class="nav"><div class="logo">Copier<span>Store</span></div><div class="nav-right"><a href="/customer-dashboard">Dashboard</a><a href="/">Shop</a><a href="/support/live">💬 Messages <span id="unreadBadge" class="badge" {% if not unread %}style="display:none"{% endif %}>{{ unread }}</span></a></div></nav>
<main class="wrap"><div class="grid">
<section class="card side"><div class="side-head">💬 Conversations</div><div id="conversationList" class="conversation-list"><div class="empty">Loading…</div></div>
<div class="new-chat"><select id="orderSelect"><option value="">General support</option>{% for o in orders %}<option value="{{ o.id }}">Order #{{ o.id }} — {{ o.status }}</option>{% endfor %}</select><button id="newChatBtn">Start conversation</button></div></section>
<section class="card chat"><div class="chat-head"><div><div id="chatTitle" class="chat-title">Select a conversation</div><div id="chatSub" style="font-size:10px;color:#64748b;margin-top:3px">You can message CopierStore or reply to an admin message.</div></div><span id="orderChip" class="order-chip" style="display:none"></span></div><div id="messages" class="messages"><div class="empty">Choose a conversation or start a new one.</div></div>
<form id="composer" class="composer"><input id="message" autocomplete="off" placeholder="Type your message…" maxlength="1000" disabled><button id="sendBtn" disabled>Send</button></form></section>
</div></main>
<script>

let conversationId=null,lastId=0,messageRequest=null,conversationRequest=null,customerRequest=null;
const list=document.getElementById('conversationList'),box=document.getElementById('messages'),input=document.getElementById('message'),send=document.getElementById('sendBtn');

async function api(url,options={},timeout=7000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...options,signal:controller.signal});
    const d=await r.json().catch(()=>({success:false,error:'Invalid server response'}));
    return {r,d};
  }finally{clearTimeout(timer);}
}
function time(v){try{return new Date(String(v).replace(' ','T')+'Z').toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch{return v||''}}
function renderConversations(rows){
  list.innerHTML='';
  if(!rows.length){list.innerHTML='<div class="empty">No conversations yet.</div>';return}
  rows.forEach(c=>{
    const b=document.createElement('button');b.className='conversation '+(Number(c.id)===Number(conversationId)?'active':'');b.type='button';b.dataset.id=c.id;
    const title=c.order_id?'Order #'+c.order_id:'General Support';
    b.innerHTML='<strong></strong><small></small>';
    b.querySelector('strong').textContent=title+(c.unread?'  • '+c.unread+' new':'');
    b.querySelector('small').textContent=c.last_message||'No messages yet';
    b.onclick=()=>openConversation(c.id);list.appendChild(b);
  });
}
async function loadConversations(){
  if(conversationRequest)return;
  conversationRequest=api('/api/chat/conversations');
  try{
    const {r,d}=await conversationRequest;if(!r.ok||!d.success)return;
    renderConversations(d.conversations||[]);
    const badge=document.getElementById('unreadBadge');
    badge.textContent=d.unread_total||0;badge.style.display=d.unread_total?'inline-block':'none';
    if(!conversationId && d.conversations && d.conversations.length) await openConversation(d.conversations[0].id);
  }catch(e){if(e.name!=='AbortError')console.error('conversation poll',e)}
  finally{conversationRequest=null}
}
async function populateCustomers(){
  if(customerRequest)return; customerRequest=api('/api/chat/admin/customers');
  try{ /* customer endpoint is not used on customer page */ }finally{customerRequest=null}
}
async function openConversation(id){
  if(!id)return;
  conversationId=Number(id);lastId=0;box.innerHTML='';input.disabled=false;send.disabled=false;
  await loadMessages(true);renderActive();
}
function renderActive(){document.querySelectorAll('.conversation').forEach(x=>x.classList.toggle('active',Number(x.dataset.id)===Number(conversationId)))}
function appendMessage(m,scroll=true){
  if(!m||!m.id)return;
  const row=document.createElement('div');row.className='bubble-row '+m.sender_type;
  const bub=document.createElement('div');bub.className='bubble';bub.textContent=m.message;
  const t=document.createElement('div');t.className='time';t.textContent=time(m.created_at||new Date().toISOString());
  bub.appendChild(t);row.appendChild(bub);box.appendChild(row);
  if(scroll)box.scrollTop=box.scrollHeight;
}
async function loadMessages(reset=false){
  if(!conversationId||messageRequest)return;
  messageRequest=api('/api/chat/messages?conversation_id='+conversationId+'&after_id='+lastId);
  try{
    const {r,d}=await messageRequest;if(!r.ok||!d.success)return;
    const c=d.conversation;
    if(c){
      document.getElementById('chatTitle').textContent=c.order_id?'CopierStore Support · Order #'+c.order_id:'CopierStore Support';
      const chip=document.getElementById('orderChip');
      if(c.order_id){chip.textContent='Order #'+c.order_id;chip.style.display='inline-block'}else chip.style.display='none';
    }
    const incoming=d.messages||[];
    incoming.forEach(m=>{lastId=Math.max(lastId,Number(m.id)||0);appendMessage(m,false)});
    if(reset||incoming.length)box.scrollTop=box.scrollHeight;
  }catch(e){if(e.name!=='AbortError')console.error('message poll',e)}
  finally{messageRequest=null}
}
document.getElementById('newChatBtn').onclick=async()=>{
  const fd={order_id:document.getElementById('orderSelect').value||null};
  const {r,d}=await api('/api/chat/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fd)},8000);
  if(!r.ok||!d.success){alert(d.error||'Could not start conversation');return}
  await loadConversations();await openConversation(d.conversation_id);
};
document.getElementById('composer').onsubmit=async e=>{
  e.preventDefault();const text=input.value.trim();if(!text||!conversationId)return;
  input.disabled=true;send.disabled=true;
  const fd=new FormData();fd.append('conversation_id',String(conversationId));fd.append('message',text);
  try{
    const {r,d}=await api('/api/chat/send',{method:'POST',body:fd},8000);
    if(!r.ok||!d.success){alert(d.error||'Message could not be sent.');return}
    input.value='';
    const id=Number(d.message_id)||(++lastId);
    lastId=Math.max(lastId,id);
    appendMessage({id,sender_type:'customer',message:text,created_at:new Date().toISOString()});
    // Refresh the conversation preview once; do not wait for it before showing the message.
    loadConversations();
  }catch(e){console.error(e);alert(e.name==='AbortError'?'Message request timed out. Please try again.':'Could not send message.')}
  finally{input.disabled=false;send.disabled=false;input.focus();}
};
loadConversations();
setInterval(loadConversations,7000);
setInterval(()=>loadMessages(false),2500);

</script></body></html>
