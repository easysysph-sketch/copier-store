name: Apply final chat send hotfix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove blocking chat side effects
        shell: python
        run: |
          from pathlib import Path
          import py_compile

          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          old = '''        # Keep the message insert and conversation timestamp in ONE transaction.\n        cur.execute("UPDATE chat_conversations SET updated_at=CURRENT_TIMESTAMP WHERE id=?", (conv_id,))\n        try:\n            conn.commit()\n        except Exception as exc:\n            if "stream not found" not in str(exc).lower():\n                raise\n            sender = "admin" if is_admin else "customer"\n            conn.close()\n            conn=sqlite3.connect(DATABASE_PATH); conn.row_factory=sqlite3.Row; cur=conn.cursor()\n            cur.execute("SELECT id,conversation_id FROM chat_messages WHERE conversation_id=? AND customer_id=? AND sender_type=? AND message=? ORDER BY id DESC LIMIT 1",(conv_id,customer_id,sender,message))\n            existing_msg=cur.fetchone()\n            if existing_msg:\n                msg_id=existing_msg['id']\n                conv_id=existing_msg['conversation_id']\n            else:\n                cur.execute("INSERT INTO chat_messages (customer_id,sender_type,message,is_read,conversation_id,order_id) VALUES (?,?,?,?,?,?)",(customer_id,sender,message,0,conv_id,order_id))\n                msg_id=cur.lastrowid\n                cur.execute("UPDATE chat_conversations SET updated_at=CURRENT_TIMESTAMP WHERE id=?", (conv_id,))\n                conn.commit()\n\n'''
          new = '''        # The send path is intentionally minimal: one INSERT and one COMMIT.\n        # Conversation timestamps and notifications must never block delivery.\n        try:\n            conn.commit()\n        except Exception as exc:\n            if "stream not found" not in str(exc).lower():\n                raise\n            sender = "admin" if is_admin else "customer"\n            conn.close()\n            conn=sqlite3.connect(DATABASE_PATH); conn.row_factory=sqlite3.Row; cur=conn.cursor()\n            cur.execute("SELECT id,conversation_id FROM chat_messages WHERE conversation_id=? AND customer_id=? AND sender_type=? AND message=? ORDER BY id DESC LIMIT 1",(conv_id,customer_id,sender,message))\n            existing_msg=cur.fetchone()\n            if existing_msg:\n                msg_id=existing_msg['id']\n                conv_id=existing_msg['conversation_id']\n            else:\n                cur.execute("INSERT INTO chat_messages (customer_id,sender_type,message,is_read,conversation_id,order_id) VALUES (?,?,?,?,?,?)",(customer_id,sender,message,0,conv_id,order_id))\n                msg_id=cur.lastrowid\n                conn.commit()\n\n'''
          if old not in s:
              raise SystemExit('send transaction block not found')
          s = s.replace(old, new, 1)

          start = s.find('        # Notifications are secondary. A notification schema/plugin mismatch must')
          end = s.find('        return jsonify({"success": True, "conversation_id": conv_id, "message_id": msg_id})', start)
          if start == -1 or end == -1:
              raise SystemExit('notification block not found')
          s = s[:start] + '        # No notification-table write is performed in the send request.\n        # The chat conversation list derives unread state directly from chat_messages.\n' + s[end:]

          bad = '        unread_total = 0\n        unread_total=cur.fetchone()[0]\n'
          if bad not in s:
              raise SystemExit('unread bug block not found')
          s = s.replace(bad, '        unread_total = 0\n', 1)

          for marker in [
              'def chat_admin_customers_api():\n    ensure_live_chat_tables()\n',
              'def chat_admin_orders_api():\n    ensure_live_chat_tables()\n',
              'def chat_link_order_api():\n    ensure_live_chat_tables()\n',
          ]:
              if marker in s:
                  s = s.replace(marker, marker.replace('    ensure_live_chat_tables()\n', ''), 1)

          p.write_text(s, encoding='utf-8')
          py_compile.compile('app.py', doraise=True)

          for name in ['templates/admin_messages.html', 'templates/live_chat.html']:
              q = Path(name)
              t = q.read_text(encoding='utf-8')
              t = t.replace("},8000);", "},12000);")
              t = t.replace("},8000);\n", "},12000);\n")
              q.write_text(t, encoding='utf-8')

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/admin_messages.html templates/live_chat.html
          git diff --cached --check
          git rm .github/workflows/chat-final-hotfix.yml
          git add -u
          git commit -m "Fix chat timeout by making send path minimal"
          git push origin HEAD:main
