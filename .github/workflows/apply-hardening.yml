name: Apply CopierStore hardening

on:
  push:
    paths:
      - .deploy_hardening.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply hardening
        run: python .deploy_hardening.py

      - name: Validate
        run: |
          python -m py_compile app.py
          git diff --check

      - name: Commit final deployment build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py Procfile SECURITY_DEPLOYMENT.md render.yaml
          git rm .deploy_hardening.py .github/workflows/apply-hardening.yml
          git commit -m "Deploy hardened CopierStore build"
          git push origin HEAD:main
