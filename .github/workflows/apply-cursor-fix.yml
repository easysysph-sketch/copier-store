name: Apply Turso cursor fix

on:
  push:
    paths:
      - .fix_cursor_reconnect.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .fix_cursor_reconnect.py
      - name: Validate
        run: python -m py_compile app.py
      - name: Commit patch and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm .fix_cursor_reconnect.py .github/workflows/apply-cursor-fix.yml
          git commit -m "Fix Turso stale cursor retry"
          git push origin HEAD:main
