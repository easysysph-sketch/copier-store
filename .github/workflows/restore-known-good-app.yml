name: Restore known-good app

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-known-good-app.yml

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore app.py from known-good commit
        run: |
          git show 3539f38:app.py > app.py
          python -m py_compile app.py

      - name: Commit restored app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Restore known-good application build"
          git push origin HEAD:main
